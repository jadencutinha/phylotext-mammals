[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-charisma"
version = "0.1.0"
description = "Does text-embedding similarity of mammal descriptions recover phylogeny or human attention?"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "dendropy>=5.0",
    "rapidfuzz>=3.5",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
