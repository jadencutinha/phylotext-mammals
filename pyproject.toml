[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-charisma"
version = "0.1.0"
description = "Does text-embedding similarity of mammal descriptions recover phylogeny or human attention?"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "dendropy>=5.0",
    "rapidfuzz>=3.5",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "sentence-transformers>=3.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-bio>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
