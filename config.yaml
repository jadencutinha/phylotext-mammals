target_clade:                    # the Carnivora pilot; outputs in data/interim, data/processed, reports/tables
  rank: order
  name: Carnivora

# Full-scale runs: `--clade mammalia` on any script (or LC_CLADE=mammalia, or `make ... CLADE=mammalia`)
# deep-merges the entry below over every setting in this file. Interim, processed and table outputs go to
# a mammalia/ subdirectory, so the pilot outputs are untouched. Raw downloads and the Wikipedia/API caches are shared.
clades:
  mammalia:
    target_clade: {rank: class, name: Mammalia}
    output_subdir: mammalia
    masking:                     # full-scale rules (docs/preregistration_amendment_fullscale.md, Change 2)
      head_noun_rule: final_noun # whole final word of a common name only; names whose last word is not the head noun give none
      epithets_anywhere: false   # epithets masked only inside a binomial or an abbreviated one
      name_ranks: [subclass, infraclass, magnorder, superorder, order, suborder, infraorder, parvorder, superfamily, family, subfamily, tribe]
      extra_taxonomy_terms:      # the pilot's list, plus vernacular names of orders and higher clades (the pilot's "carnivoran")
        [carnivoran, Pinnipedia, pinniped, Arctoidea, arctoid, Musteloidea, musteloid, Feloidea, feloid, Canoidea, canoid,
         Nandinioidea, Arctocephalinae, Mungotinae, Vulpini, Canini, Lutrini,
         monotreme, marsupial, placental, eutherian, metatherian, therian, xenarthran, afrotherian, afrothere,
         primate, rodent, lagomorph, cetacean, chiropteran, artiodactyl, cetartiodactyl, perissodactyl, eulipotyphlan,
         diprotodont, dasyuromorph, didelphimorph, peramelemorph, sirenian, proboscidean, hyracoid, afrosoricid, macroscelid, scandentian]
      keep_terms:                # the pilot's list, plus words the rule still masks that are not taxon names in these texts
        [canines, iceland,
         tail, tails, head, heads, sides, human, humans,               # from "Plain Bare Tail", "Flounder's Head", "Snow Sides", "Human"
         bull, bulls, cow, cows, buck, bucks, stag, stags,             # sex terms used for many species; from "Blue Bull", "Cow", "Marsh Buck", "Stag"
         ounce, ounces, jack, digger, runner, runners, canary, pinyin, # units and words from "Ounce", "Saddle Jack", "Gray Digger", "Cloud Runner", "Sea Canary", "Chinese Pinyin"
         fiber, fibers, boss, fossorial]                               # historical genus Fiber; "boss" is Bos + plural s; "fossorial" contains a genus name
    traits:
      include_volant: true       # adds COMBINE terrestrial_volant to the terrestrial-or-aquatic group; also writes ecology_no_volant.npy

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  reports: reports

sources:
  mdd:
    zip_url: https://raw.githubusercontent.com/mammaldiversity/mammaldiversity.github.io/master/assets/data/MDD.zip
    species_glob: "MDD_v*_*species.csv"
    synonym_glob: "Species_Syn_Current_v*.csv"
  tree:
    mcc_url: https://raw.githubusercontent.com/n8upham/MamPhy_v1/master/_DATA/MamPhy_fullPosterior_BDvr_Completed_5911sp_topoCons_NDexp_MCC_v2_target.tre
    mcc_filename: MamPhy_fullPosterior_BDvr_Completed_5911sp_topoCons_NDexp_MCC_v2_target.tre
    schema: nexus
    posterior_url: https://www.googleapis.com/download/storage/v1/b/data.vertlife.org/o/mammaltree%2FCompleted_5911sp_topoCons_NDexp.zip?alt=media
    posterior_filename: Completed_5911sp_topoCons_NDexp.zip
  elton_traits:                  # EltonTraits 1.0 mammals, Wilman et al. 2014, doi:10.6084/m9.figshare.3559887
    url: https://ndownloader.figshare.com/files/5631084
    filename: MamFuncDat.txt
    md5: 59c3eee29d3ed0a33a002975a5a8cc75
  combine:                       # COMBINE reported (not imputed) traits, Soria et al. 2021, doi:10.6084/m9.figshare.13028255
    url: https://ndownloader.figshare.com/files/27703263
    filename: trait_data_reported.csv
    md5: d894586c3858620723b1182d8b491d3e

matching:
  fuzzy_review_threshold: 85
  fuzzy_accept_threshold: 92
  fuzzy_min_margin: 3

wikipedia:
  api_url: https://en.wikipedia.org/w/api.php
  wikidata_api_url: https://www.wikidata.org/w/api.php
  user_agent: "lineage-or-charisma/0.1 (https://github.com/jadencutinha/phylotext-mammals; Princeton COS398 research)"
  min_interval_seconds: 0.5
  max_retries: 5
  backoff_seconds: 2.0
  timeout_seconds: 30
  description_headings:
    - description
    - physical description
    - physical characteristics
    - characteristics
    - appearance
    - anatomy and morphology
    - anatomy
    - morphology

sanity_check:
  groups:
    big_cats: {rank: genus, name: Panthera}
    canids: {rank: family, name: Canidae}
    felids: {rank: family, name: Felidae}
    pinnipeds_phocids: {rank: family, name: Phocidae}
  example_species: [Panthera leo, Canis lupus, Ursus arctos]

corpus:
  min_tokens: 50                 # below this a species is flagged is_stub; counted on the unmasked text
  tokenizer: BAAI/bge-large-en-v1.5   # tokenizer used for n_tokens (special tokens not counted)

masking:
  levels: [strict, taxonomy, none]   # first entry is the primary level
  token: "[TAXON]"
  # scientific names that MDD's order/suborder/family/subfamily/genus columns do not supply
  extra_taxonomy_terms:
    - carnivoran
    - Pinnipedia
    - pinniped
    - Arctoidea
    - arctoid
    - Musteloidea
    - musteloid
    - Feloidea
    - feloid
    - Canoidea
    - canoid
    - Nandinioidea
    - Arctocephalinae
    - Mungotinae
    - Vulpini
    - Canini
    - Lutrini
  keep_terms: [canines, iceland]     # never masked: "canines" is almost always teeth; Iceland is a place
  keep_when_followed_by:
    canine: [tooth, teeth, tip]      # "canine teeth" stays; "a canine native to ..." is masked
  head_noun_rule: pilot              # pilot: last word plus the last part of a hyphenated one ("Scaly-tail" -> tail); see masking.head_nouns
  epithets_anywhere: true            # pilot: current species epithets are masked wherever they occur
  name_ranks: [order, suborder, family, subfamily]   # MDD rank columns whose names (and derived forms) are masked

embedding:
  models:                        # first entry is the primary model; add a line to add a model
    - BAAI/bge-large-en-v1.5
    - sentence-transformers/all-mpnet-base-v2
  rules: [chunk, truncate]       # first entry is the primary rule
  max_tokens: null               # per-passage limit incl. special tokens; null = the model's own max_seq_length
  chunk_overlap: 32              # tokens shared by consecutive chunks
  batch_size: 16
  device: auto                   # auto | cuda | mps | cpu

matrices:
  exclude_stubs: true            # drops is_stub species (n_tokens < corpus.min_tokens) from every matrix and species_order.txt
  sensitivity_min_tokens: 100    # used only by `07_build_matrices.py --sensitivity`, which writes matrices_min100/

stats:                           # fixed in docs/preregistration.md; do not change after H1 has been run
  permutations: 9999
  seed: 20261004                 # every Mantel test starts a fresh generator from this seed
  method: spearman               # primary correlation; pearson is reported alongside it
  alpha: 0.05

traits:
  max_unmatched: 5               # scripts/10_build_ecology.py stops for review above this many unreviewed species without a trait record
  reviewed_missing:              # reviewed 2026-10-04: genuinely absent from the database, kept as missing (no imputation)
    - Bassaricyon medius         # not in EltonTraits: split or described after MSW3
    - Bassaricyon neblina
    - Bdeogale omnivora
    - Canis lupaster
    - Canis rufus
    - Cryptoprocta spelea        # extinct
    - Lutra congica
    - Neofelis diardi
    - Felis catus                # not in COMBINE (domestic)

attention:
  pageviews_api_url: https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article
  project: en.wikipedia
  access: all-access
  agent: user
  start: "2023-01"               # first and last month of the window, inclusive
  end: "2025-12"

week3_sanity:
  showcase_species:
    - Panthera leo
    - Panthera tigris
    - Panthera pardus
    - Canis lupus
    - Vulpes vulpes
    - Ursus maritimus
    - Ursus arctos
    - Ailuropoda melanoleuca
    - Suricata suricatta
    - Enhydra lutris
  k_neighbors: 5
  near_neighbor_quantile: 0.05   # "near" = closer than this quantile of all pairwise text distances
  min_family_size: 2
